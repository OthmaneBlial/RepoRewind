<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1280"
  height="640"
  viewBox="0 0 1280 640"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">RepoRewind — your codebase has a past</title>
  <desc id="description">A product preview of RepoRewind turning real Git history into a replayable city.</desc>
  <defs>
    <clipPath id="city-frame">
      <rect x="596" y="42" width="642" height="556" rx="28" />
    </clipPath>
    <linearGradient id="image-shade" x1="0" x2="1">
      <stop offset="0" stop-color="#090c0a" stop-opacity="0.96" />
      <stop offset="0.46" stop-color="#090c0a" stop-opacity="0.28" />
      <stop offset="1" stop-color="#090c0a" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#090c0a" />
  <g opacity="0.18" stroke="#f1e7d3" stroke-width="1">
    <path d="M0 532H1280M0 572H1280M0 612H1280" />
    <path d="M44 500V640M124 500V640M204 500V640M284 500V640M364 500V640M444 500V640M524 500V640" />
  </g>

  <g clip-path="url(#city-frame)">
    <image
      href="screenshots/city-timeline.png"
      x="304"
      y="42"
      width="1223"
      height="556"
      preserveAspectRatio="xMidYMid slice"
    />
    <rect x="596" y="42" width="642" height="556" fill="url(#image-shade)" />
  </g>
  <rect
    x="596"
    y="42"
    width="642"
    height="556"
    rx="28"
    fill="none"
    stroke="#f1e7d3"
    stroke-opacity="0.16"
    stroke-width="2"
  />

  <g transform="translate(64 54)">
    <g transform="translate(0 0)">
      <rect x="0" y="18" width="15" height="30" rx="3" fill="#ffb45c" />
      <rect x="21" y="6" width="15" height="42" rx="3" fill="#f1e7d3" />
      <rect x="42" y="26" width="15" height="22" rx="3" fill="#80d8c3" />
    </g>
    <text x="76" y="45" fill="#f1e7d3" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700">
      Repo
      <tspan font-weight="400">Rewind</tspan>
    </text>

    <text
      x="0"
      y="124"
      fill="#ffb45c"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="14"
      font-weight="700"
      letter-spacing="2.2"
    >
      A PRIVATE DOCUMENTARY OF YOUR CODEBASE
    </text>
    <text x="0" y="208" fill="#f1e7d3" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="600">
      Your codebase
    </text>
    <text x="0" y="282" fill="#f1e7d3" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="600">
      has a past.
    </text>
    <text
      x="0"
      y="336"
      fill="#a9b2ac"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="21"
    >
      Replay how it became what it is—
    </text>
    <text
      x="0"
      y="366"
      fill="#a9b2ac"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="21"
    >
      privately, from real Git evidence.
    </text>

    <rect x="0" y="412" width="424" height="68" rx="14" fill="#121713" stroke="#80d8c3" stroke-opacity="0.32" />
    <circle cx="28" cy="435" r="5" fill="#ff7a67" />
    <circle cx="46" cy="435" r="5" fill="#ffb45c" />
    <circle cx="64" cy="435" r="5" fill="#80d8c3" />
    <text
      x="28"
      y="463"
      fill="#80d8c3"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="19"
      font-weight="600"
    >
      $ npx reporewind .
    </text>

    <text
      x="0"
      y="536"
      fill="#7f8c84"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="12"
      font-weight="700"
      letter-spacing="1.8"
    >
      LOCAL-FIRST · OPEN SOURCE · NO TELEMETRY
    </text>
  </g>
</svg>
