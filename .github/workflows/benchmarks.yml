name: Performance benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '33 3 1 * *'

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Advisory benchmark / Node 24 + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use the pinned Node.js release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install the locked Chromium benchmark runtime
        run: npx playwright install --with-deps chromium
      - name: Run the non-blocking benchmark suite
        run: npm run benchmark -- --output benchmark-results/github-actions.json
      - name: Upload the complete benchmark record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reporewind-benchmark-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
