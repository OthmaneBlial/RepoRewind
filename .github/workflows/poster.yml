name: Evidence poster

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional Git ref to analyze
        required: false
        type: string
      max_commits:
        description: Maximum first-parent commits
        required: true
        default: '5000'
        type: string
      retention_days:
        description: Private Actions artifact retention
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '7'

permissions:
  contents: read

concurrency:
  group: evidence-poster-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Private artifact / Node 24 + Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Use the pinned Node.js release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: poster
        name: Generate the deterministic poster twice
        uses: ./.github/actions/poster
        with:
          ref: ${{ inputs.ref }}
          max-commits: ${{ inputs.max_commits }}
          retention-days: ${{ inputs.retention_days }}
      - name: Upload the private short-retention artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reporewind-poster-${{ github.run_id }}
          path: ${{ steps.poster.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
