changelog:
  exclude:
    labels:
      - skip changelog
  categories:
    - title: First-time contributors
      labels:
        - first-time contributor
    - title: Accessibility
      labels:
        - accessibility
    - title: Features and improvements
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - '*'
